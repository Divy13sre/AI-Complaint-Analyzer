<style>

<div class="container">

```
<h1>AI Complaint Analyzer</h1>

<p class="subtitle">
    Analyze customer complaints quickly and efficiently
</p>

<label for="complaint">Enter your complaint:</label>

<textarea
    id="complaint"
    rows="6"
    placeholder="Example: My payment was deducted but my order was not placed..."
></textarea>

<button onclick="analyzeComplaint()">
    Analyze Complaint
</button>

<button onclick="showHistory()">
    View Complaint History
</button>

<button onclick="showDashboard()">
    View Dashboard
</button>

<div id="loading">
    Analyzing complaint...
</div>

<div id="history"></div>

<div id="dashboard"></div>

<div class="result">

    <h2>Analysis Result</h2>

    <p>
        Category:
        <span id="category" class="value">-</span>
    </p>

    <p>
        Priority:
        <span id="priority" class="value">-</span>
    </p>

    <p>
        Summary:
        <span id="summary" class="value">-</span>
    </p>

</div>
```

</div>

<script>

async function analyzeComplaint() {

    const complaint =
        document.getElementById("complaint").value;

    if (complaint.trim() === "") {
        alert("Please enter a complaint.");
        return;
    }

    document.getElementById("loading").style.display = "block";

    try {

        const response = await fetch(
            "https://ai-complaint-analyzer-5v7a.onrender.com/analyze-complaint",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    complaint: complaint
                })
            }
        );

        const data = await response.json();

        document.getElementById("category").textContent =
            data.category;

        const priorityElement =
            document.getElementById("priority");

        priorityElement.textContent = data.priority;

        priorityElement.className = "value priority";

        if (data.priority === "High") {
            priorityElement.classList.add("high");
        }
        else if (data.priority === "Medium") {
            priorityElement.classList.add("medium");
        }
        else {
            priorityElement.classList.add("low");
        }

        document.getElementById("summary").textContent =
            data.summary;

    }

    catch (error) {

        alert("Unable to connect to the backend.");
        console.log(error);

    }

    finally {

        document.getElementById("loading").style.display = "none";

    }
}


async function showHistory() {

    try {

       const response = await fetch(
    "https://ai-complaint-analyzer-5v7a.onrender.com/history"
);

        const data = await response.json();

        const historyDiv =
            document.getElementById("history");

        historyDiv.innerHTML =
            "<h2 class='dashboard-title'>Complaint History</h2>";

        data.history.forEach((item, index) => {

            let priorityClass = "low";

            if (item.priority === "High") {
                priorityClass = "high";
            }
            else if (item.priority === "Medium") {
                priorityClass = "medium";
            }

            historyDiv.innerHTML += `
                <div class="result">

                    <h3>Complaint ${index + 1}</h3>

                    <p>
                        <strong>Complaint:</strong><br>
                        ${item.complaint}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${item.category}
                    </p>

                    <p>
                        <strong>Priority:</strong>
                        <span class="priority ${priorityClass}">
                            ${item.priority}
                        </span>
                    </p>

                    <p>
                        <strong>Summary:</strong><br>
                        ${item.summary}
                    </p>

                </div>
            `;

        });

    }

    catch (error) {

        alert("Unable to load complaint history.");
        console.log(error);

    }
}


async function showDashboard() {

    try {

        const response = await fetch(
            "https://ai-complaint-analyzer-5v7a.onrender.com/dashboard"
        );

        const data = await response.json();

        const dashboardDiv =
            document.getElementById("dashboard");

        dashboardDiv.innerHTML = `

            <h2 class="dashboard-title">
                Dashboard
            </h2>

            <div class="dashboard-cards">

                <div class="card">
                    <h3>Total Complaints</h3>
                    <p>${data.total_complaints}</p>
                </div>

                <div class="card">
                    <h3>High Priority</h3>
                    <p>${data.high_priority}</p>
                </div>

                <div class="card">
                    <h3>Medium Priority</h3>
                    <p>${data.medium_priority}</p>
                </div>

                <div class="card">
                    <h3>Low Priority</h3>
                    <p>${data.low_priority}</p>
                </div>

            </div>

            <h3 class="dashboard-title">
                Category Statistics
            </h3>

            <div class="category-list">
        `;

        for (const category in data.category_count) {

            dashboardDiv.innerHTML += `
                <p>
                    ${category}:
                    <strong>
                        ${data.category_count[category]}
                    </strong>
                </p>
            `;

        }

        dashboardDiv.innerHTML += `
            </div>
        `;

    }

    catch (error) {

        alert("Unable to load dashboard.");
        console.log(error);

    }
}

</script>

</body>
